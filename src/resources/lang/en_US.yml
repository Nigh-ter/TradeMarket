# ============================================================
#  TradeMarket 2.9 language file (English / en_US)
#  Color codes: &a &e &c &7 &8 &6 &b &f &l etc.
#  Keys map 1:1 to code; missing keys are reported at startup
#  lang-version is informational (missing files are auto-extracted)
# ============================================================

lang-version: 14

prefix: "&8[&6Market&8] &r"

# ================= Common =================
common:
  no-permission: "&cYou don't have permission to use this"
  player-only: "&cThis command can only be used by players"
  economy-unavailable: "&cEconomy system is not ready (Vault + an economy plugin required), contact an admin"
  invalid-number: "&cInvalid amount, examples: 100, 1.5k, 2m"
  invalid-amount: "&cInvalid amount"
  hand-empty: "&cHold the item you want to list first"
  inventory-full: "&cYour inventory is full, free up some space"
  not-enough-money: "&cYou don't have enough money"
  internal-error: "&cInternal error, operation cancelled and rolled back, check console logs"
  input-cancelled: "&7Input cancelled"
  input-timeout: "&7Input timed out and was cancelled"
  page: "&7Page &f{page} &7/ &f{max}"
  reloaded: "&aConfig and language files reloaded"
  world-disabled: "&cThis command is disabled in this world"

# ================= Market =================
market:
  search-prompt: "&eType a search keyword in chat (30s), supports Chinese, type &f- &e to clear"
  price-prompt: "&eType min and max total price (in currency), use &f- &e for no limit, a single number = min only; type &f- &e to clear"
  listed: "&aListed &f{item} &ax&f{amount}&a for &f{symbol}{total}&a in total, money is settled on purchase"
  list-fee-charged: "&7Listing fee charged: &f{symbol}{fee}"
  list-limit: "&cYou reached your active listings limit"
  list-gone: "&cThis listing no longer exists (just sold or cancelled)"
  price-too-low: "&cUnit price is below the minimum"
  price-too-high: "&cUnit price exceeds the maximum"
  blacklisted: "&cThis item cannot be listed"
  price-confirm: "&eYour price deviates from recent sales — confirm in the menu"
  cant-afford-fee: "&cNot enough money for the listing fee"
  buy-success: "&aPurchase complete! The item is in your mailbox, use &e/tk mailbox &a to claim"
  buy-own: "&cYou cannot buy your own listing"
  cancel-success: "&aListing cancelled, item returned to your mailbox"
  cancel-not-owner: "&cThis is not your listing"
  sold-notify-seller: "&aYour item was sold to &f{buyer}&a, received &f{symbol}{income}&a (tax &f{symbol}{tax}&a)"
  expired-returned-subject: "&eExpired listing returned"
  buy:
    subject: "&eThe item you bought has arrived"
