# ================= Player mail =================
send:
  usage: "&cUsage: /tk send <player> item/descr [descr note]"
  self: "&cYou cannot mail yourself"
  done: "&aMail sent"
  hand-empty: "&cHold the item you want to send first"
  type-item: "Item (in hand)"
  type-message: "Text message"
  cant-afford-fee: "&cNot enough money for the fee &f{symbol}{fee}"
  item-subject: "&eItem from a player"
  message-subject: "&eMessage from a player"


