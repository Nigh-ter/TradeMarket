  offer-subject-mail: "&eBuy offer received (escrowed)"
  offer-accepted-notify: "&e[Orders] &f{buyer} &7accepted your offer, &f{amount} &7sold, income &f{symbol}{income}&7 (tax &f{symbol}{tax}&7)"
